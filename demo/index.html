<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>prpr-auto-offset DEMO</title>
<link rel="stylesheet" href="./style.css">
<main>
  <section>
    <div class="section-heading"><button id="theme" class="secondary" type="button" aria-label="切换到暗色模式" title="切换到暗色模式" aria-pressed="false">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/></svg>
    </button></div>
    <label>音频文件<input id="audio" type="file" accept="audio/*"></label>
    <label>音符 JSON<textarea id="notes" rows="7" spellcheck="false"></textarea></label>
    <div class="fields">
      <label>作者偏移 / 搜索中心 (ms)<input id="center" type="number" value="0" min="-10000" max="10000" step="1" required></label>
      <label>搜索半径 (ms)<input id="range" type="number" value="300" min="5" max="2000" step="5" required></label>
      <label>音频前端<select id="frontend"><option value="2">SuperFlux（推荐）</option><option value="1">SpectralFlux</option><option value="0">EnergyDiff</option></select></label>
    </div>
    <button id="run" disabled>估计偏移</button><button id="sample" class="secondary">恢复内置样例</button>
    <p id="status" role="status" aria-live="polite">正在加载 WebAssembly…</p>
  </section>
  <section id="result" hidden>
    <h2>对齐结果</h2>
    <div class="metrics"><div>谱面修正值<strong id="correction"></strong></div><div>绝对偏移<strong id="offset"></strong></div><div>相关系数<strong id="score"></strong></div></div>
    <p id="quality"></p>
    <p>谱面修正值 = 绝对偏移 − 作者偏移。reliable 仅表示相关系数超过 0.2，并非质量保证。</p>
    <canvas id="curve" width="960" height="300" role="img" aria-label="相关系数随绝对偏移变化的曲线"></canvas>
    <p>横轴：绝对偏移 (ms) · 纵轴：相关系数 · 虚线：0.35 / 0.6 参考线</p>
  </section>
</main>
<script type="module" src="./app.js"></script>
</html>
