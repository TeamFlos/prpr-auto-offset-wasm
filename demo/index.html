<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>prpr auto-offset</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="ambient" aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand">
        <a
          class="phira"
          href="https://phira.moe"
          target="_blank"
          rel="noreferrer"
          aria-label="Phira"
          title="phira.moe"
        >
          <img src="./phira.png" alt="" />
        </a>
        <span class="wordmark">AUTO OFFSET</span>
      </div>
      <div class="topbar-actions">
        <button id="swap" class="primary" type="button" hidden>换个谱面</button>
        <a
          class="icon"
          href="https://github.com/TeamFlos/prpr-auto-offset-wasm"
          target="_blank"
          rel="noreferrer"
          aria-label="GitHub 仓库"
          title="GitHub"
        >
          <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"
            />
          </svg>
        </a>
        <button
          id="theme"
          class="icon"
          type="button"
          aria-label="切换到浅色模式"
          title="切换到浅色模式"
          aria-pressed="false"
        >
          <svg
            class="sun"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"
            />
          </svg>
          <svg
            class="moon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z" />
          </svg>
        </button>
      </div>
    </header>

    <main>
      <section class="hero" id="hero">
        <h1 aria-label="拖入谱面包">
          DROP<br /><span class="typed-wrap" aria-hidden="true"
            ><span id="typed" class="typed">.PEZ</span><span class="caret"></span
          ></span>
        </h1>
        <label class="dropzone" id="dropzone">
          <input id="pez" type="file" accept=".pez,.zip" aria-label="选择谱面包" />
          <span class="drop-icon" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M12 15V4m0 0 4 4m-4-4L8 8" />
              <path d="M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3" />
            </svg>
          </span>
          <span class="drop-title">拖入谱面包</span>
          <span class="drop-sub">.pez / .zip</span>
        </label>
      </section>

      <section class="result" id="result" hidden>
        <div class="readout">
          <div class="readout-main">
            <span class="label">推荐延迟</span>
            <div class="readout-value">
              <div class="correction">
                <span id="recommended">+0.0</span><span class="unit">ms</span>
              </div>
              <div class="final" id="final"></div>
            </div>
          </div>
          <div class="readout-side">
            <div class="score"><span id="score">0.000</span><span class="label">匹配</span></div>
            <div class="meta" id="meta"></div>
          </div>
        </div>
        <div class="stage" id="stage">
          <canvas id="curve" role="img" aria-label="相关系数曲线"></canvas>
          <div class="tooltip" id="tooltip" hidden></div>
        </div>
      </section>

      <p class="statusline">
        <span id="status" role="status" aria-live="polite">正在加载 WebAssembly…</span>
      </p>

      <footer class="thanks" id="thanks">
        <span class="label">Special Thanks</span>
        <p>
          <a href="https://github.com/liquidhelium" target="_blank" rel="noreferrer">液氦</a> for
          Algo &amp;
          <a href="https://github.com/Evi233" target="_blank" rel="noreferrer">Evidence</a> for Demo
        </p>
      </footer>

      <details class="advanced" id="advanced">
        <summary>高级</summary>
        <div class="advanced-grid">
          <label>音频文件<input id="audio" type="file" accept="audio/*" /></label>
          <label
            >音频前端<select id="frontend">
              <option value="2">SuperFlux</option>
              <option value="1">SpectralFlux</option>
              <option value="0">EnergyDiff</option>
            </select></label
          >
          <label
            >搜索中心 (ms)<input
              id="center"
              type="number"
              value="0"
              min="-10000"
              max="10000"
              step="1"
              required
          /></label>
          <label
            >搜索半径 (ms)<input
              id="range"
              type="number"
              value="300"
              min="5"
              max="2000"
              step="5"
              required
          /></label>
        </div>
        <label class="notes-label"
          >音符 JSON<textarea id="notes" rows="7" spellcheck="false"></textarea>
        </label>
        <button id="run" class="ghost small" type="button" disabled>重新分析</button>
        <p class="hint">音频不会离开浏览器</p>
      </details>
    </main>

    <div class="loading" id="loading" hidden role="status" aria-live="polite">
      <div class="loading-card">
        <span class="spinner" aria-hidden="true"></span><span>分析中</span>
      </div>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
