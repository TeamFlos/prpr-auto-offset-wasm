[package]
name = "prpr-auto-offset-wasm"
description = "WebAssembly bindings for Phira's prpr-auto-offset delay-alignment library"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/TeamFlos/prpr-auto-offset-wasm"
rust-version = "1.70"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
# `wasm-opt` in the locally installed binaryen (120) is older than the wasm features
# (bulk-memory / nontrapping-fptoi) emitted by rustc, so it fails to validate. We skip it
# here and run a feature-aware `wasm-opt` manually in CI/build script.
wasm-opt = false

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[dependencies]
prpr-auto-offset = { git = "https://github.com/TeamFlos/phira", package = "prpr-auto-offset" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[dev-dependencies]
# nothing yet
